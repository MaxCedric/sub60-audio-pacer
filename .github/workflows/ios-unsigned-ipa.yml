name: Build Unsigned iOS IPA for Sideloadly (100% Free)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests (43 Tests)
        run: npm test

      - name: Expo Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Fix Node Binary Path for Xcode Build Scripts
        run: |
          # Force Xcode to use CI's node binary (not any hardcoded local path)
          NODE_PATH=$(which node)
          echo "NODE_BINARY=${NODE_PATH}" > ios/.xcode.env.local
          echo "Using node at: $NODE_PATH"
          cat ios/.xcode.env.local

      - name: Disable Code Signing & Strip Entitlements
        working-directory: ios
        run: |
          # 1. Patch project.pbxproj — Manual signing, no team, no entitlements
          find . -name "project.pbxproj" -exec sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/CODE_SIGN_ENTITLEMENTS = [^;]*;/CODE_SIGN_ENTITLEMENTS = "";/g' \
            {} +

          # 2. Remove or empty any .entitlements files (they force signing checks)
          find . -name "*.entitlements" | while read f; do
            echo "Emptying entitlements: $f"
            echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict></dict></plist>' > "$f"
          done

          # 3. Patch Podfile: disable signing on all CocoaPods targets
          ruby -e '
          file = "Podfile"
          if File.exist?(file)
            content = File.read(file)
            signing_patch = <<-RUBY
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["CODE_SIGN_ENTITLEMENTS"] = ""
                end
              end
            RUBY
            if content.include?("post_install do |installer|")
              content.sub!("post_install do |installer|", "post_install do |installer|\n" + signing_patch)
              File.write(file, content)
              puts "Successfully patched Podfile."
            end
          end
          '
          pod install

      - name: Build Unsigned Release .app via Xcodebuild
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          set -o pipefail
          NODE_BINARY=$(which node) xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcode_build.log; BUILD_EXIT=${PIPESTATUS[0]}
          echo "===== LAST 300 LINES OF XCODE LOG ====="
          tail -300 /tmp/xcode_build.log
          cp /tmp/xcode_build.log xcode_build.log
          exit $BUILD_EXIT

      - name: Upload Xcode Build Log (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: ios/xcode_build.log
          if-no-files-found: warn

      - name: Package Payload into Sub60AudioPacer.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in build directory!"
            exit 1
          fi
          echo "Found .app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 Sub60AudioPacer-unsigned.ipa Payload

      - name: Upload .ipa Artifact for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: Sub60AudioPacer-iOS-IPA
          path: ios/Sub60AudioPacer-unsigned.ipa
          if-no-files-found: error
