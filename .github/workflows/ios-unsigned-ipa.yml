name: Build Unsigned iOS IPA for Sideloadly (100% Free)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests (43 Tests)
        run: npm test -- --watchAll=false

      - name: Expo Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Fix Node Binary Path for Xcode Build Scripts
        run: |
          NODE_PATH=$(which node)
          echo "NODE_BINARY=${NODE_PATH}" > ios/.xcode.env.local
          echo "Using node at: $NODE_PATH"

      # ─────────────────────────────────────────────────────────────────────────
      # ROOT CAUSE 1: `react-native bundle` fails because @react-native-community/cli
      # isn't invoked correctly from npx on CI.  Use `npx expo export:embed` instead
      # which is the official Expo-managed bundler command for prebuild projects.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Pre-bundle React Native JS Bundle & Assets
        run: |
          mkdir -p ios/assets
          # Use expo's own bundling for prebuild projects (avoids CLI resolution issues)
          NODE_BINARY=$(which node) npx expo export:embed \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/assets
          echo "Verified JS bundle size: $(wc -c < ios/main.jsbundle) bytes"

      - name: Disable Code Signing & Strip Entitlements
        working-directory: ios
        run: |
          # 1. Patch project.pbxproj
          find . -name "project.pbxproj" -exec sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/CODE_SIGN_ENTITLEMENTS = [^;]*;/CODE_SIGN_ENTITLEMENTS = "";/g' \
            {} +

          # 2. Empty all .entitlements files using python3
          python3 -c "
          import glob
          empty = '<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"><plist version=\"1.0\"><dict></dict></plist>'
          for f in glob.glob('**/*.entitlements', recursive=True):
              print('Emptying:', f)
              open(f, 'w').write(empty)
          "

          # 3. Patch Podfile: disable signing on all CocoaPods targets
          ruby -e '
          file = "Podfile"
          if File.exist?(file)
            content = File.read(file)
            signing_patch = <<-RUBY
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["CODE_SIGN_ENTITLEMENTS"] = ""
                end
              end
            RUBY
            if content.include?("post_install do |installer|")
              content.sub!("post_install do |installer|", "post_install do |installer|\n" + signing_patch)
              File.write(file, content)
              puts "Patched Podfile."
            end
          end
          '
          pod install

      - name: Build Unsigned Release .app via Xcodebuild
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace=$WORKSPACE Scheme=$SCHEME"
          NODE_BINARY=$(which node) xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/xcode-build" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            2>&1 | tee "$RUNNER_TEMP/xcode_build.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "xcodebuild exit: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "======= ERRORS ONLY ======="
            grep -E "error:" "$RUNNER_TEMP/xcode_build.log" | grep -v "note:\|^/\*\|^\s*//" | tail -60 || true
            echo ""
            echo "======= LAST 200 LINES ======="
            tail -200 "$RUNNER_TEMP/xcode_build.log"
            exit $BUILD_EXIT
          fi

      - name: Upload Xcode Build Log (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: ${{ runner.temp }}/xcode_build.log
          if-no-files-found: warn

      # ─────────────────────────────────────────────────────────────────────────
      # ROOT CAUSE 2: "Share error log" step was failing because xcode_build.log
      # doesn't exist when the bundle step (not xcode build) fails first.
      # Fix: guard with `if [ -f ... ]` before grepping / tailing the log.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Share error log publicly via transfer.sh
        if: failure()
        run: |
          ERROR_SNIPPET="$RUNNER_TEMP/xcode_errors.txt"
          if [ -f "$RUNNER_TEMP/xcode_build.log" ]; then
            grep -E "error:" "$RUNNER_TEMP/xcode_build.log" | grep -v "note:" | head -100 > "$ERROR_SNIPPET" || true
            echo "--- LAST 300 LINES ---" >> "$ERROR_SNIPPET"
            tail -300 "$RUNNER_TEMP/xcode_build.log" >> "$ERROR_SNIPPET"
          else
            echo "xcode_build.log not found — failure occurred before Xcode build step." > "$ERROR_SNIPPET"
          fi
          URL=$(curl --retry 3 -s --max-time 30 --upload-file "$ERROR_SNIPPET" https://transfer.sh/xcode_errors.txt 2>/dev/null || echo "UPLOAD_FAILED")
          echo ""
          echo "============================================"
          echo "PUBLIC ERROR LOG URL: $URL"
          echo "============================================"

      - name: Package Payload into Sub60AudioPacer.ipa
        run: |
          mkdir -p ios/Payload
          APP_PATH=$(find "$RUNNER_TEMP/xcode-build/Build/Products/Release-iphoneos" -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/xcode-build" -name "*.app" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then echo "Error: .app not found!"; exit 1; fi
          echo "Packaging: $APP_PATH"

          # 1. Guarantee main.jsbundle is embedded inside the .app
          if [ ! -f "$APP_PATH/main.jsbundle" ] && [ -f ios/main.jsbundle ]; then
            echo "Injecting pre-bundled main.jsbundle into $APP_PATH..."
            cp ios/main.jsbundle "$APP_PATH/main.jsbundle"
          fi

          # 2. Guarantee assets are embedded inside the .app
          if [ -d ios/assets ]; then
            echo "Injecting assets into $APP_PATH..."
            cp -r ios/assets/* "$APP_PATH/" 2>/dev/null || true
          fi

          # 3. Verify main.jsbundle exists (app will crash without it!)
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "FATAL ERROR: main.jsbundle was NOT created in $APP_PATH! App would crash on launch!"
            exit 1
          fi
          echo "SUCCESS: main.jsbundle verified inside app ($(wc -c < "$APP_PATH/main.jsbundle") bytes)!"

          cp -r "$APP_PATH" ios/Payload/
          cd ios && zip -r -9 Sub60AudioPacer-unsigned.ipa Payload

      - name: Upload .ipa Artifact for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: Sub60AudioPacer-iOS-IPA
          path: ios/Sub60AudioPacer-unsigned.ipa
          if-no-files-found: error
